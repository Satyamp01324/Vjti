version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "5174:5174"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/.env:/app/backend/.env
    restart: unless-stopped
    networks:
      - neuropilot-network

networks:
  neuropilot-network:
    driver: bridge
